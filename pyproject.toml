[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anlik"
version = "0.1.0"
description = "Ajan bir komutu çalıştırmak üzereyken ilgili kural satırını gösteren Claude Code PreToolUse hook'u"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.3"]

[project.scripts]
anlik = "anlik.kanca:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
